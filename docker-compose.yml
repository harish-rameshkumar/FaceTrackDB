# Image versions are pinned (PostgreSQL 16.15, Qdrant 1.19.2) so every machine gets the same behaviour; change them deliberately.
services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  embedder:
    build: ./embedder
    environment:
      EMBEDDER_TOKEN: ${EMBEDDER_TOKEN:-}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - insightface_models:/home/app/.insightface
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
volumes:
  pgdata:
  qdrant_data:
  insightface_models:
